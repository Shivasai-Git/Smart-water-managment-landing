<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Water Flow: residential water monitoring for flow, tank levels, quality, leaks and pump and valve control." />
    <meta name="theme-color" content="#f8f9fa" />
    <title>Smart Water Flow — intelligent water management</title>
    <script>
      document.documentElement.classList.add('js');
      // Icons stay hidden (see stitch.css) until the icon font is ready; fallback so they never stay hidden.
      setTimeout(function () { document.documentElement.classList.add('icons-ready'); }, 3500);
      addEventListener('DOMContentLoaded', function () {
        document.fonts && document.fonts.load('24px "Material Symbols Outlined"').then(function () { document.documentElement.classList.add('icons-ready'); });
      });
    </script>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-latin-fdb05b.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
